<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OOU CGPA Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --card: #111827;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --surface: #1a2535;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.05) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(124,58,237,0.07) 0%, transparent 50%);
  }

  header {
    text-align: center;
    padding: 40px 20px 20px;
    position: relative;
  }

  .logo-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    font-family: 'Space Mono', monospace;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  .semester-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .semester-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .semester-card:hover { border-color: rgba(0,212,255,0.3); }

  .sem-header {
    background: var(--surface);
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .sem-title {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .sem-gpa-badge {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(0,212,255,0.1);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid rgba(0,212,255,0.2);
  }

  .courses-table {
    padding: 14px;
  }

  .course-row {
    display: grid;
    grid-template-columns: 1fr 70px 90px;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }

  .col-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
    margin-bottom: 4px;
  }

  input, select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: 'Syne', sans-serif;
    width: 100%;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
  }

  select { cursor: pointer; }

  .add-course-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 14px 14px;
    background: none;
    border: 1px dashed var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    transition: all 0.2s;
    width: calc(100% - 28px);
  }

  .add-course-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .remove-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 0 4px;
    transition: color 0.2s;
  }

  .remove-btn:hover { color: var(--red); }

  .result-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    position: relative;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .result-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,212,255,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  .result-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    margin-bottom: 12px;
  }

  .cgpa-display {
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 8px;
    font-family: 'Space Mono', monospace;
    transition: color 0.4s;
  }

  .grade-class {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-top: 16px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .stat-item { text-align: center; }
  .stat-val {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-key {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .calc-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    color: white;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity 0.2s, transform 0.1s;
    margin-bottom: 16px;
  }

  .calc-btn:hover { opacity: 0.9; }
  .calc-btn:active { transform: scale(0.99); }

  .reset-btn {
    display: block;
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 24px;
  }

  .reset-btn:hover { color: var(--red); border-color: var(--red); }

  .grading-info {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .grading-info h4 {
    color: var(--text);
    margin-bottom: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
  }

  .grade-scale {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .grade-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
  }

  .sem-label-row {
    display: grid;
    grid-template-columns: 1fr 70px 90px;
    gap: 8px;
    padding: 0 0 4px;
  }

  /* colors by CGPA */
  .cgpa-first { color: var(--green); }
  .cgpa-second-upper { color: var(--accent); }
  .cgpa-second-lower { color: var(--yellow); }
  .cgpa-third { color: #f97316; }
  .cgpa-fail { color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="logo-badge">⚡ OOU Academic Tool</div>
  <h1>CGPA <span>Calculator</span></h1>
  <p class="subtitle">Olabisi Onabanjo University · 100L – 300L</p>
</header>

<div class="container">

  <div class="grading-info">
    <h4>OOU Grading Scale</h4>
    <div class="grade-scale">
      <span class="grade-chip">A = 70–100 → 5pts</span>
      <span class="grade-chip">B = 60–69 → 4pts</span>
      <span class="grade-chip">C = 50–59 → 3pts</span>
      <span class="grade-chip">D = 45–49 → 2pts</span>
      <span class="grade-chip">E = 40–44 → 1pt</span>
      <span class="grade-chip">F = 0–39 → 0pts</span>
    </div>
  </div>

  <div class="semester-grid" id="semesterGrid"></div>

  <button class="calc-btn" onclick="calculate()">⚡ Calculate CGPA</button>
  <button class="reset-btn" onclick="resetAll()">↺ Reset All</button>

  <div class="result-panel" id="resultPanel" style="display:none;">
    <div class="result-label">Your Cumulative GPA</div>
    <div class="cgpa-display" id="cgpaValue">—</div>
    <div class="grade-class" id="gradeClass">—</div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-val" id="totalUnits">—</div>
        <div class="stat-key">Total Units</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="totalPoints">—</div>
        <div class="stat-key">Total Points</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="semCount">—</div>
        <div class="stat-key">Semesters</div>
      </div>
    </div>
  </div>

</div>

<script>
const SEMESTERS = [
  { id: 'sem1', label: '100L — First Semester' },
  { id: 'sem2', label: '100L — Second Semester' },
  { id: 'sem3', label: '200L — First Semester' },
  { id: 'sem4', label: '200L — Second Semester' },
  { id: 'sem5', label: '300L — First Semester' },
  { id: 'sem6', label: '300L — Second Semester' },
];

const GRADE_POINTS = { A: 5, B: 4, C: 3, D: 2, E: 1, F: 0 };

function gradeFromScore(score) {
  if (score >= 70) return 'A';
  if (score >= 60) return 'B';
  if (score >= 50) return 'C';
  if (score >= 45) return 'D';
  if (score >= 40) return 'E';
  return 'F';
}

function createCourseRow(semId, idx) {
  return `
    <div class="course-row" id="${semId}-row-${idx}">
      <input type="text" placeholder="Course code / name" id="${semId}-name-${idx}" />
      <input type="number" min="1" max="6" placeholder="Units" id="${semId}-unit-${idx}" />
      <select id="${semId}-grade-${idx}">
        <option value="">Grade</option>
        <option value="A">A (5)</option>
        <option value="B">B (4)</option>
        <option value="C">C (3)</option>
        <option value="D">D (2)</option>
        <option value="E">E (1)</option>
        <option value="F">F (0)</option>
      </select>
      <button class="remove-btn" onclick="removeCourse('${semId}', ${idx})" title="Remove">✕</button>
    </div>`;
}

const semCourseCount = {};
const removedRows = {};

function renderSemesters() {
  const grid = document.getElementById('semesterGrid');
  grid.innerHTML = '';
  SEMESTERS.forEach(sem => {
    semCourseCount[sem.id] = 4;
    removedRows[sem.id] = new Set();

    let rows = '';
    for (let i = 0; i < 4; i++) rows += createCourseRow(sem.id, i);

    grid.innerHTML += `
      <div class="semester-card">
        <div class="sem-header">
          <div class="sem-title">${sem.label}</div>
          <div class="sem-gpa-badge" id="${sem.id}-gpa">GPA —</div>
        </div>
        <div class="courses-table">
          <div class="sem-label-row">
            <div class="col-label">Course</div>
            <div class="col-label">Units</div>
            <div class="col-label">Grade</div>
          </div>
          <div id="${sem.id}-rows">${rows}</div>
        </div>
        <button class="add-course-btn" onclick="addCourse('${sem.id}')">+ Add course</button>
      </div>`;
  });
}

function addCourse(semId) {
  const idx = semCourseCount[semId]++;
  const container = document.getElementById(`${semId}-rows`);
  container.insertAdjacentHTML('beforeend', createCourseRow(semId, idx));
}

function removeCourse(semId, idx) {
  const row = document.getElementById(`${semId}-row-${idx}`);
  if (row) row.remove();
}

function getSemData(semId) {
  const container = document.getElementById(`${semId}-rows`);
  const rows = container.querySelectorAll('.course-row');
  let totalUnits = 0, totalPoints = 0;
  rows.forEach(row => {
    const id = row.id.split('-row-')[1];
    const unit = parseFloat(document.getElementById(`${semId}-unit-${id}`)?.value) || 0;
    const grade = document.getElementById(`${semId}-grade-${id}`)?.value;
    if (unit > 0 && grade) {
      totalUnits += unit;
      totalPoints += unit * GRADE_POINTS[grade];
    }
  });
  return { totalUnits, totalPoints };
}

function calculate() {
  let grandUnits = 0, grandPoints = 0, activeSems = 0;

  SEMESTERS.forEach(sem => {
    const { totalUnits, totalPoints } = getSemData(sem.id);
    const badge = document.getElementById(`${sem.id}-gpa`);
    if (totalUnits > 0) {
      const gpa = (totalPoints / totalUnits).toFixed(2);
      badge.textContent = `GPA ${gpa}`;
      grandUnits += totalUnits;
      grandPoints += totalPoints;
      activeSems++;
    } else {
      badge.textContent = 'GPA —';
    }
  });

  if (grandUnits === 0) {
    alert('Please enter at least one course with units and a grade.');
    return;
  }

  const cgpa = (grandPoints / grandUnits).toFixed(2);

  let gradeClass = '', cgpaClass = '';
  const val = parseFloat(cgpa);
  if (val >= 4.50) { gradeClass = '🏆 First Class Honours'; cgpaClass = 'cgpa-first'; }
  else if (val >= 3.50) { gradeClass = '🎓 Second Class Upper'; cgpaClass = 'cgpa-second-upper'; }
  else if (val >= 2.40) { gradeClass = '📘 Second Class Lower'; cgpaClass = 'cgpa-second-lower'; }
  else if (val >= 1.50) { gradeClass = '📗 Third Class'; cgpaClass = 'cgpa-third'; }
  else { gradeClass = '⚠️ Below Honours'; cgpaClass = 'cgpa-fail'; }

  const display = document.getElementById('cgpaValue');
  display.textContent = cgpa;
  display.className = `cgpa-display ${cgpaClass}`;

  document.getElementById('gradeClass').textContent = gradeClass;
  document.getElementById('totalUnits').textContent = grandUnits;
  document.getElementById('totalPoints').textContent = grandPoints;
  document.getElementById('semCount').textContent = activeSems;
  document.getElementById('resultPanel').style.display = 'block';
  document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function resetAll() {
  if (confirm('Reset all entries?')) renderSemesters();
  document.getElementById('resultPanel').style.display = 'none';
}

renderSemesters();
</script>
</body>
</html>
